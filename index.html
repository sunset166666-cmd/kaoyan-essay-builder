<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考研英语大作文 · 逐句拼装器（英一英二通用）</title>
<style>
:root{
  --bg:#0e1116; --bg2:#131920; --panel:#161d26; --panel2:#1b2430; --panel3:#222d3a;
  --line:#2a3644; --line2:#39485a;
  --txt:#e8eef6; --dim:#93a2b3; --dim2:#6c7d90;
  --accent:#e9b44c; --accent-soft:rgba(233,180,76,.14);
  --blue:#6fb6ff; --blue-soft:rgba(111,182,255,.14);
  --green:#5fd0a8; --green-soft:rgba(95,208,168,.13);
  --red:#ff8b7d; --red-soft:rgba(255,139,125,.13);
  --violet:#b79cff; --violet-soft:rgba(183,156,255,.13);
  --radius:12px; --radius-s:8px;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --mono:"SF Mono",Menlo,Consolas,monospace;
}
html[data-theme="light"]{
  --bg:#f6f4ee; --bg2:#efece4; --panel:#ffffff; --panel2:#faf8f3; --panel3:#f1ede4;
  --line:#e2dcd0; --line2:#cfc7b7;
  --txt:#1d2228; --dim:#5c6672; --dim2:#8b939d;
  --accent:#a9762a; --accent-soft:rgba(169,118,42,.12);
  --blue:#2b6cb0; --blue-soft:rgba(43,108,176,.10);
  --green:#1f8a67; --green-soft:rgba(31,138,103,.10);
  --red:#b8452f; --red-soft:rgba(184,69,47,.10);
  --violet:#6b4fc4; --violet-soft:rgba(107,79,196,.10);
  --shadow:0 10px 28px rgba(60,50,30,.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 500px at 12% -10%, rgba(233,180,76,.07), transparent 60%),
    radial-gradient(900px 460px at 88% 0%, rgba(111,182,255,.06), transparent 62%),
    var(--bg);
  color:var(--txt);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-soft); color:var(--txt)}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:60;
  background:linear-gradient(180deg, var(--bg) 55%, rgba(14,17,22,.72));
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);
}
html[data-theme="light"] header{background:linear-gradient(180deg,var(--bg) 55%,rgba(246,244,238,.78))}
.hd-in{max-width:1560px;margin:0 auto;padding:10px 18px 8px}
.hd-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto}
.brand b{font-size:16px;letter-spacing:.3px}
.brand span{font-size:11.5px;color:var(--dim2);letter-spacing:.4px}
.kbd{font-family:var(--mono);font-size:10.5px;color:var(--dim2);border:1px solid var(--line);padding:1px 5px;border-radius:5px}

.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row + .row{margin-top:8px}
.lbl{font-size:11.5px;color:var(--dim2);letter-spacing:.5px;margin-right:2px;white-space:nowrap}

/* type buttons */
.types{display:flex;gap:6px;flex-wrap:wrap}
.tbtn{
  border:1px solid var(--line); background:var(--panel); color:var(--dim);
  padding:6px 11px; border-radius:999px; cursor:pointer; font-size:12.5px;
  transition:.16s; white-space:nowrap; font-family:inherit;
}
.tbtn:hover{border-color:var(--line2); color:var(--txt); transform:translateY(-1px)}
.tbtn.on{
  background:linear-gradient(180deg,var(--accent-soft),transparent);
  border-color:var(--accent); color:var(--accent); font-weight:600;
  box-shadow:0 0 0 1px var(--accent-soft) inset;
}
.tbtn i{font-style:normal;font-size:10px;opacity:.65;margin-left:5px}

/* select */
select, input[type="text"]{
  font-family:inherit; font-size:12.5px; color:var(--txt);
  background:var(--panel2); border:1px solid var(--line);
  border-radius:var(--radius-s); padding:6px 9px; outline:none;
  max-width:100%;
}
select:focus, input[type="text"]:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
select{cursor:pointer; appearance:none; padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim2) 50%),linear-gradient(135deg,var(--dim2) 50%,transparent 50%);
  background-position:calc(100% - 14px) 52%, calc(100% - 9px) 52%;
  background-size:5px 5px,5px 5px; background-repeat:no-repeat;
}
.sel-wide{min-width:240px; max-width:340px}

/* toggle */
.tg{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--dim);user-select:none;
  border:1px solid var(--line);padding:5px 9px;border-radius:999px;background:var(--panel);transition:.16s}
.tg:hover{color:var(--txt);border-color:var(--line2)}
.tg .dot{width:24px;height:13px;border-radius:99px;background:var(--panel3);position:relative;transition:.18s;flex:none}
.tg .dot::after{content:"";position:absolute;top:1.5px;left:1.5px;width:10px;height:10px;border-radius:50%;background:var(--dim2);transition:.18s}
.tg.on{color:var(--accent);border-color:var(--accent)}
.tg.on .dot{background:var(--accent-soft)}
.tg.on .dot::after{left:12.5px;background:var(--accent)}

.btn{
  border:1px solid var(--line);background:var(--panel);color:var(--txt);
  padding:6px 12px;border-radius:var(--radius-s);cursor:pointer;font-size:12.5px;font-family:inherit;transition:.16s;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn:hover{border-color:var(--line2);background:var(--panel2);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(180deg,rgba(233,180,76,.22),rgba(233,180,76,.08));border-color:var(--accent);color:var(--accent);font-weight:600}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn small{color:var(--dim2);font-size:10.5px}

/* ---------- layout ---------- */
main{max-width:1560px;margin:0 auto;padding:14px 18px 80px;display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);gap:16px;align-items:start}
@media (max-width:1180px){ main{grid-template-columns:1fr} }

.col{display:flex;flex-direction:column;gap:12px;min-width:0}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-hd{
  display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);
  font-size:12.5px;color:var(--dim);letter-spacing:.4px;
}
.card-hd b{color:var(--txt);font-size:13px;letter-spacing:.2px}
.card-hd .sp{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.card-bd{padding:11px 13px 13px}

/* paragraph block */
.pblock + .pblock{margin-top:12px}
.phead{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.phead .pn{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.6px;color:var(--accent);
  border:1px solid var(--accent);border-radius:5px;padding:1px 6px;background:var(--accent-soft);
}
.phead b{font-size:13px}
.phead em{font-style:normal;font-size:11.5px;color:var(--dim2)}
.phead .wc{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim2)}

/* sentence row */
.sent{
  border:1px solid transparent;border-radius:var(--radius-s);
  padding:7px 8px 8px;transition:.16s;background:transparent;
}
.sent + .sent{margin-top:4px}
.sent:hover{background:var(--panel2);border-color:var(--line)}
.sent.focus{background:var(--panel2);border-color:var(--line2)}
.sent-top{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-wrap:wrap}
.sno{
  font-family:var(--mono);font-size:10px;color:var(--dim2);border:1px solid var(--line);
  border-radius:4px;padding:0 5px;line-height:16px;flex:none;
}
.sname{font-size:11.5px;color:var(--dim);letter-spacing:.2px;flex:none}
.sent-top select{flex:1 1 210px;min-width:0}
.sent-top .mini{font-size:11px;color:var(--dim2);border:1px dashed var(--line);border-radius:6px;padding:3px 7px;cursor:pointer;background:transparent;font-family:inherit}
.sent-top .mini:hover{color:var(--accent);border-color:var(--accent)}

.en{
  font-family:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;
  font-size:14.5px;line-height:1.72;letter-spacing:.15px;
  word-break:break-word;
}
.zh{font-size:12px;color:var(--dim);line-height:1.62;margin-top:4px;word-break:break-word}
.note{font-size:11.5px;color:var(--dim2);margin-top:5px;padding-left:9px;border-left:2px solid var(--line2);line-height:1.55}
.note b{color:var(--dim);font-weight:600}
.hide-zh .zh{display:none}
.hide-note .note{display:none}
.hide-no .sno,.hide-no .sname{display:none}

/* slot */
.slot{
  display:inline;cursor:pointer;border-radius:4px;padding:1px 3px;margin:0;
  border-bottom:1.5px dashed var(--blue);color:var(--blue);background:var(--blue-soft);
  transition:.14s;font-family:inherit;font-size:inherit;line-height:inherit;
  white-space:normal;
}
.slot:hover{background:rgba(111,182,255,.26);border-bottom-style:solid}
.slot.empty{
  color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-soft);
  font-family:"PingFang SC",system-ui,sans-serif;font-size:.88em;letter-spacing:.2px;
}
.slot.filled{color:var(--green);border-bottom-color:var(--green);background:var(--green-soft)}
.slot.filled:hover{background:rgba(95,208,168,.26)}
.no-hl .slot.filled{color:inherit;background:transparent;border-bottom-color:var(--line2)}
.slot.sel{outline:2px solid var(--accent);outline-offset:1px}

/* popover */
#pop{
  position:absolute;z-index:200;width:min(430px,calc(100vw - 24px));
  background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);
  box-shadow:0 18px 48px rgba(0,0,0,.5);display:none;overflow:hidden;
}
#pop.on{display:block;animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.pop-hd{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line);background:var(--panel2)}
.pop-hd b{font-size:12.5px}
.pop-hd .tag{font-family:var(--mono);font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px}
.pop-hd .x{margin-left:auto;cursor:pointer;color:var(--dim2);font-size:15px;line-height:1;padding:2px 4px;border-radius:5px}
.pop-hd .x:hover{color:var(--red);background:var(--red-soft)}
.pop-bd{padding:9px 11px 11px;max-height:min(56vh,420px);overflow:auto}
.pop-bd::-webkit-scrollbar{width:8px}
.pop-bd::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
.pop-in{display:flex;gap:7px;margin-bottom:9px}
.pop-in input{flex:1}
.opts{display:flex;flex-direction:column;gap:5px}
.opt{
  text-align:left;border:1px solid var(--line);background:var(--panel2);color:var(--txt);
  border-radius:var(--radius-s);padding:6px 9px;cursor:pointer;font-family:inherit;transition:.13s;
}
.opt:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateX(2px)}
.opt.on{border-color:var(--green);background:var(--green-soft)}
.opt .oe{display:block;font-family:"Iowan Old Style",Georgia,serif;font-size:13.5px;line-height:1.45}
.opt .oz{display:block;font-size:11.5px;color:var(--dim);margin-top:1px}
.opt .on2{display:block;font-size:10.5px;color:var(--dim2);margin-top:2px;line-height:1.45}
.opt-group{font-size:10.5px;color:var(--dim2);letter-spacing:.6px;margin:8px 0 2px;padding-top:6px;border-top:1px dashed var(--line)}
.opt-group:first-child{margin-top:0;border-top:none;padding-top:0}
.pop-ft{display:flex;gap:6px;padding:8px 11px;border-top:1px solid var(--line);background:var(--panel2)}
.pop-ft .btn{flex:1;justify-content:center}

/* preview */
#preview .pbody{
  font-family:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;
  font-size:15px;line-height:1.85;letter-spacing:.15px;text-align:justify;
}
#preview .pbody .zh{font-family:"PingFang SC",system-ui,sans-serif;font-size:12.5px;line-height:1.75;color:var(--dim);margin-top:7px;text-align:left}
.pv-block + .pv-block{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.pv-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pv-hd b{font-size:12px;color:var(--accent);letter-spacing:.6px}
.pv-hd span{font-size:11px;color:var(--dim2);font-family:var(--mono)}
.pv-empty{color:var(--dim2);font-size:12.5px;font-style:italic}

.stat{display:flex;gap:14px;font-family:var(--mono);font-size:11px;color:var(--dim2);flex-wrap:wrap}
.stat b{color:var(--txt);font-weight:600}
.stat .ok{color:var(--green)}
.stat .warn{color:var(--red)}

/* toast */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:400;
  background:var(--panel3);color:var(--txt);border:1px solid var(--line2);
  padding:9px 16px;border-radius:999px;font-size:12.5px;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:.22s;
}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* footer hint */
.hint{font-size:11.5px;color:var(--dim2);line-height:1.7;padding:2px 2px 0}
.hint b{color:var(--dim)}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 4px;color:var(--dim)}

.no-anim, .no-anim *{transition:none !important}

/* 考场精简 */
.compact .note{display:none}
.compact .zh{display:none}
.compact .sent{padding:4px 6px}
.compact .en{font-size:14px;line-height:1.62}
.compact .pblock + .pblock{margin-top:8px}
.compact .phead{margin-bottom:5px;padding-bottom:4px}

/* 词库卡片 */
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.vchip{border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:8px;
  padding:5px 9px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  font-family:inherit;transition:.14s}
.vchip:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
.vchip b{font-weight:600;letter-spacing:.2px}
.vchip i{font-style:normal;font-size:10px;color:var(--dim2);background:var(--panel3);
  border-radius:99px;padding:0 5px;line-height:15px}

/* 桌面端：预览区吸顶 */
@media (min-width:1181px){
  main > .col:last-child{position:sticky;top:116px}
  #preview .card-bd{max-height:calc(100vh - 200px);overflow:auto}
  #preview .card-bd::-webkit-scrollbar{width:8px}
  #preview .card-bd::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
}

/* 连接词下拉 */
select.conn{flex:0 0 auto;min-width:104px;max-width:136px;font-size:11.5px;padding:4px 20px 4px 7px}
.sent-top select.conn{background-position:calc(100% - 12px) 52%, calc(100% - 7px) 52%}
</style>
</head>
<body>

<header>
  <div class="hd-in">
    <div class="hd-top">
      <div class="brand">
        <b>考研英语大作文 · 逐句拼装器</b>
        <span>英一 / 英二通用 · 图表 · 双图表 · 图画 · 文字材料</span>
      </div>
      <button class="btn ghost" id="btnTheme" title="切换浅色/深色">◑ <span>配色</span></button>
      <button class="btn ghost" id="btnUndo" title="撤销上一步（⌘/Ctrl+Z）">↶ 撤销 <small id="undoN">0</small></button>
      <button class="btn ghost" id="btnClear" title="清空所有填写">✕ 清空</button>
    </div>

    <div class="row">
      <span class="lbl">题型</span>
      <div class="types" id="types"></div>
    </div>

    <div class="row">
      <span class="lbl">真题预设</span>
      <select id="preset" class="sel-wide"></select>
      <button class="btn" id="btnLoadPreset">载入</button>
      <span class="lbl" style="margin-left:8px">模式</span>
      <div class="tg on" id="tgZh"><span class="dot"></span>中英对照</div>
      <div class="tg" id="tgCompact"><span class="dot"></span>考场精简</div>
      <div class="tg on" id="tgNo"><span class="dot"></span>句序标签</div>
      <div class="tg on" id="tgHl"><span class="dot"></span>槽位高亮</div>
    </div>
  </div>
</header>

<main>
  <!-- ================= 左：拼装 ================= -->
  <div class="col">
    <section class="card">
      <div class="card-hd">
        <b>① 逐句拼装</b>
        <span>点句子里的<b style="color:var(--blue)">彩色槽位</b>换词 · 下拉换句式方案</span>
        <span class="sp">
          <span class="kbd" id="typeTag">—</span>
        </span>
      </div>
      <div class="card-bd" id="editor"></div>
    </section>
    <section class="card">
      <div class="card-hd">
        <b>③ 图表描述词库</b>
        <span>讲义“必背单词、常用搭配”整表 · 点任一词组查看全部替换词</span>
      </div>
      <div class="card-bd" id="vocabBody"></div>
    </section>
    <div class="hint">
      <b>用法</b>：先选题型 → 选真题预设一键载入 → 逐句点槽位换词（可手输中英）→ 下拉换方案 → 右侧实时成文 → 复制。
      所有改动自动存本机；切换预设 / 清空前会存快照，可连续撤销。
    </div>
  </div>

  <!-- ================= 右：成文 ================= -->
  <div class="col">
    <section class="card" id="preview">
      <div class="card-hd">
        <b>② 全文预览</b>
        <span class="sp">
          <span class="stat" id="stat"></span>
          <button class="btn primary" id="btnCopy">⧉ 复制全文</button>
        </span>
      </div>
      <div class="card-bd" id="previewBody"></div>
    </section>
  </div>
</main>

<div id="pop">
  <div class="pop-hd">
    <b id="popTitle">槽位</b>
    <span class="tag" id="popTag">SLOT</span>
    <span class="x" id="popX">✕</span>
  </div>
  <div class="pop-bd" id="popBody"></div>
  <div class="pop-ft">
    <button class="btn" id="popClear">清空本槽</button>
    <button class="btn ghost" id="popClose">关闭</button>
  </div>
</div>
<div id="toast"></div>

<script>
(function () {
  "use strict";

  /* ============================================================
     一、槽位词库（讲义里每一处可替换词 → 可点选短语）
     ============================================================ */
  var SLOTS = {
    /* ---------- 通用主题/数据 ---------- */
    topic: {
      label: "主题词", kind: "text",
      hint: "英文主题词（实体或数据均可）。点下方真题常用词，或直接手输；中文栏用于中英对照。",
      opts: [
        { en: "Chinese residents' health literacy level", zh: "中国居民健康素养水平", note: "2023 英二 · 数据类（水平），总体描述宜用时间作主语" },
        { en: "graduates' choices", zh: "毕业生的选择", note: "2019 英二 · 实体类，适合趋势作宾语" },
        { en: "students' gains from a labor practice course", zh: "劳动实践课的学生收获", note: "2024 英二 · 静态图" },
        { en: "consumers' attitudes towards elderly-care robots", zh: "消费者对养老机器人的态度", note: "2026 英一 · 态度型（双图表）" },
        { en: "the ownership of household appliances", zh: "家用电器拥有量", note: "2025 英一 · 表格动态" },
        { en: "the participation rates in leisure activities", zh: "休闲活动参与率", note: "2025 英二 · 静态图" },
        { en: "respondents' views on children's outdoor activities", zh: "受访者对儿童户外活动的看法", note: "2026 英二 · 静态图" },
        { en: "the construction of public facilities", zh: "公共设施建设", note: "2024 英一 · 图画+图表" },
        { en: "the volume of express delivery", zh: "快递业务量", note: "2022 英二改编 · 动静结合" },

  function zhJoin(arr) {
    var s = arr.join(" ").replace(/\s+/g, " ");
    s = s.replace(/([\u4e00-\u9fa5。，；：、“”（）《》！？])\s+/g, "$1");
    s = s.replace(/\s+([\u4e00-\u9fa5。，；：、“”（）《》！？])/g, "$1");
    return s.trim();
  }

  function localsFor(sid) {
    if (sid === "u9" || sid === "u10") return { mconn: state.mconns[sid] };
    return null;
  }

  function sentencePlain(sid, lang, capFirst) {
    var r = tokens(sid, lang, localsFor(sid));
    if (lang === "zh") return r.list.map(function (t) { return t.v; }).join("");
    var cf = (capFirst === undefined) ? !r.opt.mid : capFirst;
    var list = polishTokens(r.list, cf);
    return list.map(function (t) { return t.v; }).join("");
  }

  function sentenceHtml(sid) {
    var r = tokens(sid, "en", localsFor(sid));
    var list = polishTokens(r.list, !r.opt.mid);
    var h = "";
    list.forEach(function (tk) {
      if (tk.t === "slot") {
        h += '<span class="slot filled" data-slot="' + tk.k + '" title="' +
          escAttr((SLOTS[tk.k] && SLOTS[tk.k].label) || tk.k) + '">' + esc(tk.v) + "</span>";
      } else if (tk.t === "empty") {
        h += '<span class="slot empty" data-slot="' + tk.k + '" title="点击填写">' + esc(tk.v) + "</span>";
      } else h += esc(tk.v);
    });
    return h;
  }

  function buildPara(pid) {
    var p = PARAS[pid], en = [], zh = [], prev = "";
    p.sents.forEach(function (sid) {
      var opt = currentOpt(sid);
      var openTail = /(that|which|whom|because|if|when|while)\s*$/.test(prev) || /[:;,]$/.test(prev);
      var txt = sentencePlain(sid, "en", !(openTail || opt.mid));
      var c = (sid === "u5" || sid === "u6" || sid === "u7") ? state.conns[sid] : "";
      if (c) txt = c + ", " + txt.replace(/^\s+/, "");
      en.push(txt);
      prev = txt;
      var ztxt = sentencePlain(sid, "zh");
      var zc = (sid === "u5" || sid === "u6" || sid === "u7") ? CONN_ZH[state.conns[sid] || ""] : "";
      if (zc) ztxt = zc + "，" + ztxt;
      zh.push(ztxt);
    });
    return { en: finalPolish(en.join(" ")), zh: zhJoin(zh) };
  }
  function wordCount(s) { return s ? s.split(/\s+/).filter(function (w) { return /[A-Za-z0-9%]/.test(w); }).length : 0; }

  /* ============================================================
     八、渲染
     ============================================================ */
  function applyToggles() {
    var b = document.body;
    b.classList.toggle("hide-zh", !state.toggles.zh);
    b.classList.toggle("hide-note", state.toggles.compact);
    b.classList.toggle("hide-no", !state.toggles.no);
    b.classList.toggle("no-hl", !state.toggles.hl);
    b.classList.toggle("compact", state.toggles.compact);
    document.documentElement.setAttribute("data-theme", state.theme);
    $("#tgZh").classList.toggle("on", state.toggles.zh);
    $("#tgCompact").classList.toggle("on", state.toggles.compact);
    $("#tgNo").classList.toggle("on", state.toggles.no);
    $("#tgHl").classList.toggle("on", state.toggles.hl);
  }

  function groupedOptions(pool, curId) {
    var h = "", lastG = null;
    pool.forEach(function (o) {
      var g = o.g || "方案";
      if (g !== lastG) {
        if (lastG !== null) h += "</optgroup>";
        h += '<optgroup label="' + escAttr(g) + '">';
        lastG = g;
      }
      h += '<option value="' + escAttr(o.id) + '"' + (o.id === curId ? " selected" : "") + ">" +
        esc(o.name) + "</option>";
    });
    if (lastG !== null) h += "</optgroup>";
    return h;
  }

  function connOptions(cur) {
    var h = "";
    CONNS.forEach(function (c) {
      h += '<option value="' + escAttr(c) + '"' + (c === cur ? " selected" : "") + ">" +
        (c ? esc(c) : "（无连接词）") + "</option>";
    });
    return h;
  }

  function mconnOptions(cur) {
    var h = "", list = (SLOTS.mconn && SLOTS.mconn.opts) || [];
    list.forEach(function (o) {
      h += '<option value="' + escAttr(o.en) + '"' + (o.en === cur ? " selected" : "") + ">" + esc(o.en) + "</option>";
    });
    return h;
  }

  function rowHtml(sid) {
    var def = SENT[sid];
    var opt = currentOpt(sid);
    var pool = poolOf(sid);
    var h = '<div class="sent" data-sid="' + sid + '">';
    h += '<div class="sent-top"><span class="sno">' + esc(def.no) + "</span>";
    h += '<span class="sname">' + esc(def.name) + "</span>";
    if (sid === "u5" || sid === "u6" || sid === "u7") {
      h += '<select class="conn" data-conn="' + sid + '" title="句首连接词">' + connOptions(state.conns[sid]) + "</select>";
    }
    if (sid === "u9" || sid === "u10") {
      h += '<select class="conn" data-mconn="' + sid + '" title="措施连接词">' + mconnOptions(state.mconns[sid]) + "</select>";
    }
    h += '<select data-sel="' + sid + '" title="' + escAttr(def.tip || "") + '">' +
      groupedOptions(pool, opt.id) + "</select>";
    h += "</div>";
    h += '<div class="en">' + sentenceHtml(sid) + "</div>";
    h += '<div class="zh">' + esc(zhTidy(sentencePlain(sid, "zh"))) + "</div>";
    if (opt.note) h += '<div class="note"><b>注</b> ' + esc(opt.note) + "</div>";
    h += "</div>";
    return h;
  }

  function renderEditor() {
    var t = typeById(state.type), h = "";
    t.paras.forEach(function (pid) {
      var p = PARAS[pid];
      h += '<div class="pblock" data-pid="' + pid + '">';
      h += '<div class="phead"><span class="pn">' + esc(p.title) + "</span><b>" + esc(p.sub) +
        '</b><span class="wc" data-wc="' + pid + '"></span></div>';
      p.sents.forEach(function (sid) { h += rowHtml(sid); });
      h += "</div>";
    });
    $("#editor").innerHTML = h;
    t.paras.forEach(function (pid) {
      var w = wordCount(buildPara(pid).en);
      var el = $('[data-wc="' + pid + '"]');
      if (el) el.textContent = w + " words";
    });
    $("#typeTag").textContent = t.tag;
    $$("#types .tbtn").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-type") === t.id); });
  }

  function renderPreview() {
    var t = typeById(state.type), h = "", total = 0;
    t.paras.forEach(function (pid, i) {
      var p = PARAS[pid], r = buildPara(pid), w = wordCount(r.en);
      total += w;
      h += '<div class="pv-block"><div class="pv-hd"><b>' + esc(p.title) + "</b><span>" +
        esc(p.sub) + " · " + w + " words</span></div>";
      h += '<div class="pbody">' + (r.en ? esc(r.en) : '<span class="pv-empty">（尚未填写）</span>');
      if (state.toggles.zh) h += '<div class="zh">' + esc(r.zh) + "</div>";
      h += "</div></div>";
    });
    $("#previewBody").innerHTML = h;
    var okCls = total >= 160 && total <= 230 ? "ok" : (total > 230 ? "warn" : "");
    $("#stat").innerHTML = '<span>全文 <b class="' + okCls + '">' + total + "</b> words</span>" +
      "<span>目标 <b>160–200</b></span><span>段落 <b>" + t.paras.length + "</b></span>";
  }

  var VOCAB_KEYS = ["chartOpen", "vUp", "vDown", "vFlat", "vVary", "advFast", "advSlow",
    "peakPh", "troughPh", "metric", "times", "comparePh", "rankPh", "approxW", "timePh",
    "contrastW", "conn", "clause", "aspect", "phrase"];

  function renderVocab() {
    var host = $("#vocabBody");
    if (!host) return;
    var h = '<div class="vchips">';
    VOCAB_KEYS.forEach(function (k) {
      var d = SLOTS[k];
      if (!d) return;
      h += '<button class="vchip" data-vkey="' + k + '"><b>' + esc(d.label) + "</b><i>" +
        ((d.opts || []).length) + "</i></button>";
    });
    h += "</div>";
    host.innerHTML = h;
  }

  function renderAll() {
    applyToggles();
    renderEditor();
    renderPreview();
    renderVocab();
    save();
  }

  /* ============================================================
     九、词库面板
     ============================================================ */
  function positionPop(anchor) {
    var pop = $("#pop");
    var r = anchor.getBoundingClientRect();
    var vw = window.innerWidth, vh = window.innerHeight;
    var w = pop.offsetWidth || 420, hh = pop.offsetHeight || 380;
    var left = r.left + window.scrollX;
    if (left + w > window.scrollX + vw - 10) left = window.scrollX + vw - w - 10;
    if (left < 10) left = 10;
    var top = r.bottom + window.scrollY + 8;
    if (r.bottom + hh + 20 > vh) {
      top = r.top + window.scrollY - hh - 8;
      if (top < window.scrollY + 8) top = window.scrollY + 8;
    }
    pop.style.left = left + "px";
    pop.style.top = top + "px";
  }

  function openPop(key, anchor) {
    popKey = key;
    var def = SLOTS[key] || { label: key, opts: [], hint: "" };
    var cur = state.slots[key] || { en: "", zh: "" };
    $("#popTitle").textContent = def.label + (def.kind === "choice" ? " · 词库" : "");
    $("#popTag").textContent = key.toUpperCase();
    var h = '<div class="pop-in">' +
      '<input type="text" id="popEn" placeholder="英文（留空则显示 【' + escAttr(def.label) + "】）\" value=\"" + escAttr(cur.en) + '">' +
      '<input type="text" id="popZh" placeholder="中文（对照用）" value="' + escAttr(cur.zh) + '">' +
      "</div>";
    if (def.hint) h += '<div class="note" style="margin:0 0 8px"><b>提示</b> ' + esc(def.hint) + "</div>";
    h += '<div class="opts">';
    var lastG = null;
    (def.opts || []).forEach(function (o, i) {
      if (o.g && o.g !== lastG) { h += '<div class="opt-group">' + esc(o.g) + "</div>"; lastG = o.g; }
      var on = cur.en === o.en ? " on" : "";
      h += '<button class="opt' + on + '" data-opt="' + i + '">' +
        '<span class="oe">' + esc(o.en) + "</span>" +
        (o.zh ? '<span class="oz">' + esc(o.zh) + "</span>" : "") +
        (o.note ? '<span class="on2">' + esc(o.note) + "</span>" : "") +
        "</button>";
    });
    h += "</div>";
    $("#popBody").innerHTML = h;
    $("#pop").classList.add("on");
    positionPop(anchor);
    $$(".slot").forEach(function (s) { s.classList.toggle("sel", s.getAttribute("data-slot") === key); });
  }

  function closePop() {
    $("#pop").classList.remove("on");
    popKey = null;
    $$(".slot.sel").forEach(function (s) { s.classList.remove("sel"); });
  }

  function setSlot(key, en, zh) {
    state.slots[key] = { en: en || "", zh: zh || "" };
    renderAll();
  }

  /* ============================================================
     十、动作
     ============================================================ */
  function setType(id) {
    if (state.type === id) return;
    snapshot();
    state.type = id;
    var t = typeById(id);
    for (var k in t.def) if (t.def.hasOwnProperty(k)) state.choices[k] = t.def[k];
    renderAll();
    toast("已切换到「" + t.name + "」");
  }

  function applyPreset(id) {
    var p = null;
    for (var i = 0; i < PRESETS.length; i++) if (PRESETS[i].id === id) p = PRESETS[i];
    if (!p) return;
    snapshot();
    state.type = p.type;
    state.choices = defaultChoices();
    var t = typeById(p.type);
    for (var k in t.def) if (t.def.hasOwnProperty(k)) state.choices[k] = t.def[k];
    for (var k2 in p.ch) if (p.ch.hasOwnProperty(k2)) state.choices[k2] = p.ch[k2];
    state.slots = baseSlots();
    for (var k3 in p.sl) {
      if (!p.sl.hasOwnProperty(k3)) continue;
      var parts = String(p.sl[k3]).split("||");
      state.slots[k3] = { en: parts[0], zh: parts[1] || parts[0] };
    }
    state.conns = { u5: "", u6: "Furthermore", u7: "In the end" };
    if (p.cn) { state.conns.u5 = p.cn[0] || ""; state.conns.u6 = p.cn[1] || ""; state.conns.u7 = p.cn[2] || ""; }
    state.mconns = { u9: "For one thing", u10: "For another" };
    if ($("#preset")) $("#preset").value = p.id;
    renderAll();
    toast("已载入：" + p.name);
  }

  function copyAll() {
    var t = typeById(state.type), parts = [];
    t.paras.forEach(function (pid) {
      var r = buildPara(pid);
      parts.push(r.en);
      if (state.toggles.zh) parts.push("【" + PARAS[pid].title + "·译文】" + r.zh);
    });
    var text = parts.join("\n\n");
    var done = function () { toast("全文已复制（" + wordCount(text) + " 词）"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
    } else fallbackCopy(text, done);
  }
  function fallbackCopy(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.left = "-9999px";
    document.body.appendChild(ta);
    try { ta.select(); } catch (e1) {}
    try { document.execCommand("copy"); } catch (e2) {}
    document.body.removeChild(ta);
    done();
  }

  function clearAll() {
    snapshot();
    for (var k in state.slots) if (state.slots.hasOwnProperty(k)) state.slots[k] = { en: "", zh: "" };
    renderAll();
    toast("已清空填写（可撤销）");
  }

  /* ============================================================
     十一、事件绑定
     ============================================================ */
  function bind() {
    $("#types").addEventListener("click", function (e) {
      var b = e.target.closest(".tbtn");
      if (b) setType(b.getAttribute("data-type"));
    });

    $("#preset").addEventListener("change", function () { /* 等点“载入” */ });
    $("#btnLoadPreset").addEventListener("click", function () {
      applyPreset($("#preset").value);
    });

    $("#tgZh").addEventListener("click", function () { state.toggles.zh = !state.toggles.zh; renderAll(); });
    $("#tgCompact").addEventListener("click", function () { state.toggles.compact = !state.toggles.compact; renderAll(); });
    $("#tgNo").addEventListener("click", function () { state.toggles.no = !state.toggles.no; renderAll(); });
    $("#tgHl").addEventListener("click", function () { state.toggles.hl = !state.toggles.hl; renderAll(); });

    $("#btnTheme").addEventListener("click", function () {
      state.theme = state.theme === "dark" ? "light" : "dark";
      document.body.classList.add("no-anim");
      renderAll();
      window.setTimeout(function () { document.body.classList.remove("no-anim"); }, 220);
    });
    $("#btnUndo").addEventListener("click", undo);
    $("#btnClear").addEventListener("click", clearAll);
    $("#btnCopy").addEventListener("click", copyAll);

    $("#editor").addEventListener("change", function (e) {
      var sel = e.target;
      if (sel.hasAttribute && sel.hasAttribute("data-sel")) {
        snapshot();
        state.choices[sel.getAttribute("data-sel")] = sel.value;
        renderAll();
      } else if (sel.hasAttribute && sel.hasAttribute("data-conn")) {
        snapshot();
        state.conns[sel.getAttribute("data-conn")] = sel.value;
        renderAll();
      } else if (sel.hasAttribute && sel.hasAttribute("data-mconn")) {
        snapshot();
        state.mconns[sel.getAttribute("data-mconn")] = sel.value;
        renderAll();
      }
    });

    $("#vocabBody").addEventListener("click", function (e) {
      var b = e.target.closest ? e.target.closest(".vchip") : null;
      if (!b) return;
      openPop(b.getAttribute("data-vkey"), b);
    });

    $("#editor").addEventListener("click", function (e) {
      var s = e.target.closest ? e.target.closest(".slot") : null;
      if (!s) return;
      e.preventDefault();
      var key = s.getAttribute("data-slot");
      if (popKey === key && $("#pop").classList.contains("on")) { closePop(); return; }
      openPop(key, s);
    });

    $("#pop").addEventListener("click", function (e) {
      var o = e.target.closest ? e.target.closest(".opt") : null;
      if (!o) return;
      var def = SLOTS[popKey];
      if (!def) return;
      var opt = def.opts[parseInt(o.getAttribute("data-opt"), 10)];
      if (!opt) return;
      setSlot(popKey, opt.en, opt.zh || opt.en);
      var en = $("#popEn"), zh = $("#popZh");
      if (en) en.value = opt.en;
      if (zh) zh.value = opt.zh || opt.en;
      $$("#pop .opt").forEach(function (x) { x.classList.remove("on"); });
      o.classList.add("on");
    });

    $("#pop").addEventListener("input", function (e) {
      if (!popKey) return;
      if (e.target.id === "popEn" || e.target.id === "popZh") {
        setSlot(popKey, $("#popEn").value, $("#popZh").value);
      }
    });

    $("#popX").addEventListener("click", closePop);
    $("#popClose").addEventListener("click", closePop);
    $("#popClear").addEventListener("click", function () {
      if (!popKey) return;
      snapshot();
      setSlot(popKey, "", "");
      if ($("#popEn")) $("#popEn").value = "";
      if ($("#popZh")) $("#popZh").value = "";
    });

    document.addEventListener("click", function (e) {
      var pop = $("#pop");
      if (!pop.classList.contains("on")) return;
      if (pop.contains(e.target)) return;
      if (e.target.closest && e.target.closest(".slot")) return;
      closePop();
    });

    document.addEventListener("keydown", function (e) {
      if ((e.metaKey || e.ctrlKey) && String(e.key).toLowerCase() === "z") { e.preventDefault(); undo(); }
      if (e.key === "Escape") closePop();
    });

    window.addEventListener("resize", function () { closePop(); });
  }

  /* ============================================================
     十二、启动
     ============================================================ */
  function buildChrome() {
    var h = "";
    TYPES.forEach(function (t) {
      h += '<button class="tbtn" data-type="' + t.id + '">' + esc(t.name) + "</button>";
    });
    $("#types").innerHTML = h;

    var o = "";
    PRESETS.forEach(function (p) { o += '<option value="' + p.id + '">' + esc(p.name) + "</option>"; });
    $("#preset").innerHTML = o;
  }

  function boot() {
    buildChrome();
    if (!load()) {
      applyPreset("p1");
      undoStack.length = 0;
      updateUndoBtn();
    } else {
      applyToggles(); renderEditor(); renderPreview();
    }
    bind();
    updateUndoBtn();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

  /* 供回归测试使用（不影响正常使用） */
  window.__ESSAY__ = {
    state: state, TYPES: TYPES, SENT: SENT, SLOTS: SLOTS, PRESETS: PRESETS, PARAS: PARAS,
    setType: setType, applyPreset: applyPreset, setSlot: setSlot, renderAll: renderAll,
    buildPara: buildPara, sentencePlain: sentencePlain, openPop: openPop, closePop: closePop,
    undo: undo, clearAll: clearAll, copyAll: copyAll, isPlural: isPlural, conj: conj,
    undoSize: function () { return undoStack.length; }
  };
})();
</script>
</body>
</html>
